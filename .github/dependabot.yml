# Configure Dependabot scanning.
version: 2

updates:
  # Check for updates to GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
  # Update some npm dependencies in groups.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 40
    groups:
      qunit:
        patterns:
          - "*qunit*"
          - "sinon*"
      webpack:
        patterns:
          - "*webpack*"
      grunt-contrib:
        patterns:
          - "grunt-contrib-*"
      grunt:
        patterns:
          - "*grunt-*"
      docker-related:
        patterns:
          - "dotenv*"
          - "wait-on"
    ignore:
      # These are currently managed manually through Grunt tasks.
      - dependency-name: "@wordpress/*"
      # UglifyJS updates very frequently. Update this less often below.
      - dependency-name: "uglify-js"

  # UglifyJS updates very frequently.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore: "*"
    allow:
      - dependency-name: "uglify-js"

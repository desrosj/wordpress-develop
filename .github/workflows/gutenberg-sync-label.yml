# Manages labels for pull requests.
name: Label Management

on:
  pull_request_target:
    types:
      - opened
      - reopened

# Disable permissions for all available scopes by default.
# Any needed permissions are configured at the job level.
permissions: {}

jobs:
  # Adds a label to pull requests updating the pinned `gutenberg.sha` hash value.
  label-gutenberg-sync-prs:
    name: Label Gutenberg sync PRs
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'WordPress/wordpress-develop' && startsWith( github.head_ref, 'gutenberg-sync/' ) }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Add the Gutenberg Sync label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo WordPress/wordpress-develop --add-label "Gutenberg Sync"

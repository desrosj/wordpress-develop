# Responsible for making comments on pull requests, such as commenting for first time contributors.
name: Pull Request Comments

on:
  pull_request_target:
    types: [ 'opened', 'synchronize', 'reopened', 'edited' ]
  workflow_run:
    workflows: [ 'Compare Built Files', 'Test Build Processes' ]
    types:
      - completed

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the pull request number for pull requests, the ID of the
  # triggering run for workflow_run events, or the commit hash for any other events.
  #
  # The commit hash is always the latest commit on the default branch for workflow_run events. Using the run ID instead
  # prevents completions of unrelated runs from replacing each other while pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.event.number || github.event_name == 'workflow_run' && github.event.workflow_run.id || github.sha }}

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Comments on a pull request when the author is a first time contributor.
  post-welcome-message:
    name: Post a welcome comment for first-time contributors
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: write
    timeout-minutes: 5
    if: ${{ github.repository == 'WordPress/wordpress-develop' && github.event_name == 'pull_request_target' && github.event.action == 'opened' }}
    steps:
      - name: Post welcome comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Only comment for first-time contributors.
            const authorAssociation = pr.author_association;
            const isFirstTimer = authorAssociation === 'FIRST_TIME_CONTRIBUTOR' || authorAssociation === 'FIRST_TIMER';

            if ( ! isFirstTimer ) {
              core.info( `Author @${ author } has author association "${ authorAssociation }". Skipping welcome comment.` );
              return;
            }

            // Check if the author has opened other pull requests in the repository.
            const query = `repo:${ owner }/${ repo } is:pr author:${ author }`;
            const searchResults = await github.rest.search.issuesAndPullRequests( {
              q: query,
              per_page: 5,
            } );

            const otherPRs = searchResults.data.items.filter( ( item ) => item.number !== pr.number );
            if ( otherPRs.length > 0 ) {
              core.info( `Author @${ author } has already opened other pull requests. Skipping welcome comment.` );
              return;
            }

            // Check if a welcome comment already exists to avoid duplicate comments.
            const comments = await github.paginate( github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            } );

            const hasWelcomeComment = comments.some( ( comment ) =>
              comment.user && comment.user.type === 'Bot' && comment.body.includes( 'first pull request to `wordpress-develop`' )
            );

            if ( hasWelcomeComment ) {
              core.info( 'A welcome comment already exists on this pull request.' );
              return;
            }

            const welcomeLines = [
              `Hi @${ author }! 👋`,
              'Thank you for your contribution to WordPress! 💖',
              'It looks like this is your first pull request to `wordpress-develop`. Here are a few things to be aware of that may help you out!',
              '**Pull requests must be attached to a [Trac](https://core.trac.wordpress.org/) ticket.** WordPress Core does not use GitHub as an issue tracker. To ensure your pull request receives the necessary attention, please include the Trac ticket\'s full URL in your pull request description.',
              '**Pull requests are never merged on GitHub.** The WordPress codebase continues to be managed through the SVN repository that this GitHub repository mirrors. Please feel free to open pull requests to work on any contribution you are making.',
              'More information about how GitHub pull requests can be used to contribute to WordPress can be found in [the Core Handbook](https://make.wordpress.org/core/handbook/contribute/git/github-pull-requests-for-code-review/).',
              '> [!IMPORTANT]\n> If your pull request addresses a security issue, please close it. Security vulnerabilities must be reported privately and handled according to the project\'s responsible disclosure policy. See [Reporting Security Vulnerabilities](https://make.wordpress.org/core/handbook/testing/reporting-security-vulnerabilities/) in the Core Handbook for more information.',
              '**Please link your WordPress.org account to GitHub.** To ensure your contribution is correctly credited in a WordPress release, [connect your GitHub account in your WordPress.org profile](https://profiles.wordpress.org/me/). If you do not have a WordPress.org account, you can [register one](https://login.wordpress.org/register). More information is available in [Associating GitHub accounts with WordPress.org profiles](https://make.wordpress.org/core/2020/03/19/associating-github-accounts-with-wordpress-org-profiles/).',
              '**Please include automated tests.** Including tests in your pull request is one way to help your patch be considered faster. To learn about WordPress\' test suites, visit the [Automated Testing](https://make.wordpress.org/core/handbook/testing/automated-testing/) page in the handbook.',
              'If you have not had a chance, please review the [Contribute with Code page](https://make.wordpress.org/core/handbook/contribute/) in the [WordPress Core Handbook](https://make.wordpress.org/core/handbook/).',
              'The [Developer Hub](https://developer.wordpress.org/) also documents the various [coding standards](https://make.wordpress.org/core/handbook/best-practices/coding-standards/) that are followed:\n- [PHP Coding Standards](https://developer.wordpress.org/coding-standards/wordpress-coding-standards/php/)\n- [CSS Coding Standards](https://developer.wordpress.org/coding-standards/wordpress-coding-standards/css/)\n- [HTML Coding Standards](https://developer.wordpress.org/coding-standards/wordpress-coding-standards/html/)\n- [JavaScript Coding Standards](https://developer.wordpress.org/coding-standards/wordpress-coding-standards/javascript/)\n- [Accessibility Coding Standards](https://developer.wordpress.org/coding-standards/wordpress-coding-standards/accessibility/)\n- [Inline Documentation Standards](https://developer.wordpress.org/coding-standards/inline-documentation-standards/)',
              'Thank you,\nThe WordPress Project',
            ];

            await github.rest.issues.createComment( {
              owner,
              repo,
              issue_number: pr.number,
              body: welcomeLines.join( '\n\n' ),
            } );

            try {
              await github.rest.reactions.createForIssue( {
                owner,
                repo,
                issue_number: pr.number,
                content: 'hooray',
              } );
            } catch ( error ) {
              core.info( `Could not add reaction: ${ error.message }` );
            }

            core.notice( `Created welcome comment for pull request: ${ pr.html_url }` );

  # Leaves a comment on a pull request with a link to test the changes in a WordPress Playground instance.
  playground-details:
    name: Comment on a pull request with Playground details
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: write
    if: >
      github.repository == 'WordPress/wordpress-develop' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'Test Build Processes' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts( {
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: process.env.RUN_ID,
            } );

            const matchArtifact = artifacts.data.artifacts.filter( ( artifact ) => {
              return artifact.name === 'pr-number'
            } )[0];

            if ( ! matchArtifact ) {
              core.setFailed( 'No artifact found!' );
              return;
            }

            const download = await github.rest.actions.downloadArtifact( {
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            } );

            const fs = require( 'fs' );
            fs.writeFileSync( '${{github.workspace}}/pr-number.zip', Buffer.from( download.data ) )
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Unzip the artifact containing the PR number
        run: unzip pr-number.zip

      - name: Leave a comment about testing with Playground
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require( 'fs' );
            const issue_number = Number( fs.readFileSync( './NR' ) );

            core.info( `Checking pull request #${issue_number}.` );

            // Confirm that the pull request is still open before leaving a comment.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
            });

            if ( pr.data.state !== 'open' ) {
              core.info( 'The pull request has been closed. No comment will be left.' );
              return;
            }

            // Comments are only added after the first successful build. Check for the presence of a comment and bail early.
            const commentInfo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            };

            const comments = ( await github.rest.issues.listComments( commentInfo ) ).data;

            for ( const currentComment of comments ) {
              if ( currentComment.user.type === 'Bot' && currentComment.body.includes( 'Test using WordPress Playground' ) ) {
                core.info( 'A comment with instructions to test within a Playground instance already exists.' );
                return;
              }
            };

            // No comment was found. Create one.
            commentInfo.body = `## Test using WordPress Playground
            The changes in this pull request can previewed and tested using a [WordPress Playground](https://developer.wordpress.org/playground/) instance.

            [WordPress Playground](https://developer.wordpress.org/playground/) is an experimental project that creates a full WordPress instance entirely within the browser.

            ### Some things to be aware of
            - All changes will be lost when closing a tab with a Playground instance.
            - All changes will be lost when refreshing the page.
            - A fresh instance is created each time the link below is clicked.
            - Every time this pull request is updated, a new ZIP file containing all changes is created. If changes are not reflected in the Playground instance,
            it's possible that the most recent build failed, or has not completed. Check the [list of workflow runs to be sure](https://github.com/WordPress/wordpress-develop/actions/workflows/test-build-processes.yml).

            For more details about these limitations and more, check out the [Limitations page](https://wordpress.github.io/wordpress-playground/limitations/) in the WordPress Playground documentation.

            [Test this pull request with WordPress Playground](https://playground.wordpress.net/wordpress.html?pr=${ issue_number }).
            `;

            await github.rest.issues.createComment( commentInfo );
            core.notice( `Created Playground comment for pull request: ${ pr.data.html_url }` );

  # Leaves a comment on a pull request when the build script output differs from the WordPress/WordPress repository.
  #
  # The comparison artifact is created by an unprivileged pull_request workflow, so its contents are untrusted:
  # - The pull request number is only used when the pull request's head commit matches the triggering run.
  # - The report is rendered here by the version of the action on the default branch, which validates and escapes
  #   every value it reads from the artifact.
  build-server-comparison:
    name: Comment on a pull request with build server differences
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: write
    timeout-minutes: 5
    if: >
      github.repository == 'desrosj/wordpress-develop' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'Compare Built Files' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const artifacts = await github.paginate( github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: process.env.RUN_ID,
            } );

            const matchArtifact = artifacts.find( ( artifact ) => artifact.name === 'build-server-comparison' );

            if ( ! matchArtifact ) {
              core.setFailed( 'No artifact found!' );
              return;
            }

            const download = await github.rest.actions.downloadArtifact( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            } );

            const fs = require( 'fs' );
            fs.writeFileSync( `${ process.env.RUNNER_TEMP }/build-server-comparison.zip`, Buffer.from( download.data ) );

      - name: Unzip the artifact containing the comparison results
        run: unzip -q "${RUNNER_TEMP}/build-server-comparison.zip" -d "${RUNNER_TEMP}/build-server-comparison"

      - name: Confirm the pull request matches the workflow run
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require( 'fs' );
            const prNumber = fs.readFileSync( `${ process.env.RUNNER_TEMP }/build-server-comparison/NR`, 'utf8' ).trim();

            if ( ! /^[1-9][0-9]*$/.test( prNumber ) ) {
              core.setFailed( 'The artifact does not contain a valid pull request number.' );
              return;
            }

            const pr = await github.rest.pulls.get( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number( prNumber ),
            } );

            if ( pr.data.state !== 'open' ) {
              core.info( `Pull request #${ prNumber } has been closed. No comment will be left.` );
              return;
            }

            // A different head commit means either the pull request was updated after the run started, in which case
            // a newer run will comment, or the artifact names another pull request.
            if ( pr.data.head.sha !== process.env.HEAD_SHA ) {
              core.info( `The head of pull request #${ prNumber } (${ pr.data.head.sha }) does not match the workflow run (${ process.env.HEAD_SHA }). No comment will be left.` );
              return;
            }

            core.setOutput( 'number', prNumber );

      # This job does not check out the repository: `$/` fetches the action from this workflow's commit, which is the
      # default branch for workflow_run events. Code from the pull request is never run here.
      - name: Render the comparison report
        if: ${{ steps.pr.outputs.number }}
        uses: $/.github/actions/build-server-comparison-report
        with:
          comparison-dir: ${{ runner.temp }}/build-server-comparison
          output-file: ${{ runner.temp }}/build-server-comparison.md
          # GitHub limits comments to 65,536 characters. Room is left for the text added below.
          max-length: 64000
          head-sha: ${{ github.event.workflow_run.head_sha }}
          run-url: ${{ github.event.workflow_run.html_url }}

      - name: Leave a comment with any differences
        if: ${{ steps.pr.outputs.number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require( 'fs' );
            const MARKER = '<!-- build-server-comparison -->';
            const reportFile = `${ process.env.RUNNER_TEMP }/build-server-comparison.md`;
            const report = fs.readFileSync( reportFile, 'utf8' );
            const fileCount = Number( fs.readFileSync( `${ reportFile }.count`, 'utf8' ) );

            const commentInfo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number( process.env.PR_NUMBER ),
            };

            const comments = await github.paginate( github.rest.issues.listComments, commentInfo );
            const existing = comments.find( ( comment ) => comment.user.type === 'Bot' && comment.body.includes( MARKER ) );

            // Only comment when there are differences, but keep an existing comment up to date.
            if ( fileCount === 0 && ! existing ) {
              core.info( 'The build directory is identical to WordPress/WordPress. No comment will be left.' );
              return;
            }

            const { owner, repo } = context.repo;
            const sha = process.env.HEAD_SHA;
            commentInfo.body = `${ MARKER }\n${ report }\n`;
            commentInfo.body += `_Last updated for [\`${ sha.slice( 0, 7 ) }\`](https://github.com/${ owner }/${ repo }/commit/${ sha })._\n\n`;
            commentInfo.body += '**Review these differences carefully for any unexpected results.** They show how the files in the WordPress/WordPress repository would change if this pull request were committed, along with any differences between the build script and the build server.\n';

            if ( existing ) {
              await github.rest.issues.updateComment( { owner, repo, comment_id: existing.id, body: commentInfo.body } );
              core.notice( `Updated build server comparison comment: ${ existing.html_url }` );
            } else {
              const { data } = await github.rest.issues.createComment( commentInfo );
              core.notice( `Created build server comparison comment: ${ data.html_url }` );
            }

  # Manages comments reminding contributors to include a Trac ticket link when opening a pull request.
  trac-ticket-check:
    name: Manage Trac ticket reminders for pull requests
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: write
    if: ${{ github.repository == 'WordPress/wordpress-develop' && github.event_name == 'pull_request_target' && ! github.event.pull_request.draft && github.event.pull_request.state == 'open' }}
    steps:
      - name: Check for Trac ticket and manage comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number } = context.issue;

            // Check for the presence of a comment and bail early.
            const comments = ( await github.rest.issues.listComments( { owner, repo, issue_number: number } ) ).data;

            const hasMissingTicketComment = comments.find( comment => comment.user.type === 'Bot' && comment.body.includes( 'Trac Ticket Missing' ) );

            if ( hasMissingTicketComment ) {
              // Trac ticket link found, delete existing "Trac Ticket Missing" comment.
              await github.rest.issues.deleteComment( { owner, repo, comment_id: hasMissingTicketComment.id } );
              return;
            }

            // No comment was found. Create one.
            const pr = ( await github.rest.pulls.get( { owner, repo, pull_number: number } ) ).data;

            const prBody = pr.body ?? '';
            const prTitle = pr.title ?? '';

            const tracTicketRegex = new RegExp( '(https?://core.trac.wordpress.org/ticket/|Core-|ticket:)([0-9]+)', 'g' );
            const tracTicketMatches = prBody.match( tracTicketRegex ) || prTitle.match( tracTicketRegex );

            if ( ! tracTicketMatches ) {
              core.info( `Creating missing Trac ticket comment for pull request: ${ pr.html_url }` );
              await github.rest.issues.createComment( {
                owner,
                repo,
                issue_number: number,
                body: `## Trac Ticket Missing
            This pull request is missing a link to a [Trac ticket](https://core.trac.wordpress.org/). For a contribution to be considered, there must be a corresponding ticket in Trac.

            To attach a pull request to a Trac ticket, please include the ticket's full URL in your pull request description. More information about contributing to WordPress on GitHub can be found in [the Core Handbook](https://make.wordpress.org/core/handbook/contribute/git/github-pull-requests-for-code-review/).
            `,
              } );
            }

# Opens (or updates) a single draft pull request that updates the bundled
# Gutenberg commit reference (package.json -> gutenberg.sha) for one branch:
#   - "trunk": the commit for Gutenberg's latest public (non-prerelease) release.
#   - an X.Y branch: the head of Gutenberg's matching wp/X.Y branch.
#
# The WordPress/wordpress-develop repository does not accept pushed branches, so
# this workflow is designed to run from a FORK. It checks out the target branch
# from upstream (WordPress/wordpress-develop), pushes a gutenberg-sync/<branch>
# branch to the fork it runs in, and opens a pull request from that fork branch
# back to upstream. Each run targets exactly one branch.
#
# Authentication:
#   - GITHUB_TOKEN (built in) pushes the branch to the fork.
#   - GUTENBERG_SYNC_TOKEN (optional secret) is a personal access token used to
#     open/update the pull request on upstream and apply the "Gutenberg Sync"
#     label. It needs permission to create PRs and label them on upstream (i.e.
#     a committer's token). Without it, the branch is still pushed and the run
#     prints a link to open the pull request manually.
name: Gutenberg Sync

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update: "trunk" or an X.Y branch name (e.g. "6.8").'
        required: true
        type: string
        default: 'trunk'

# Disable permissions for all available scopes by default.
# Any needed permissions are configured at the job level.
permissions: {}

env:
  # Where pull requests are opened and the target branch is read from.
  UPSTREAM_REPO: WordPress/wordpress-develop
  # The target branch and the bot-managed PR head branch, derived from the input.
  BASE_BRANCH: ${{ inputs.branch }}
  HEAD_BRANCH: gutenberg-sync/${{ inputs.branch }}

# Serialize runs for the same target branch; allow different branches in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  # Creates or updates the draft "Gutenberg Sync" PR for the requested branch.
  # Trunk-specific and version-specific work is gated on inputs.branch; every
  # other step is shared.
  sync:
    name: Sync ${{ inputs.branch }}
    runs-on: ubuntu-24.04
    # Runs from a fork; the canonical repository does not accept pushed branches.
    if: ${{ github.repository != 'WordPress/wordpress-develop' }}
    timeout-minutes: 10
    permissions:
      # Push the gutenberg-sync/<branch> branch to the fork this workflow runs in.
      contents: write
    steps:
      - name: Checkout the upstream target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: WordPress/wordpress-develop
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release SHA
        if: ${{ inputs.branch == 'trunk' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release=$(gh api repos/WordPress/gutenberg/releases/latest)
          TAG=$(jq -r '.tag_name' <<<"$release")
          RELEASE_URL=$(jq -r '.html_url' <<<"$release")

          ref=$(gh api "repos/WordPress/gutenberg/git/refs/tags/${TAG}")
          obj_type=$(jq -r '.object.type' <<<"$ref")
          obj_sha=$(jq -r '.object.sha' <<<"$ref")
          if [ "$obj_type" = "tag" ]; then
            NEW_SHA=$(gh api "repos/WordPress/gutenberg/git/tags/${obj_sha}" --jq '.object.sha')
          else
            NEW_SHA="$obj_sha"
          fi

          OLD_SHA=$(jq -r '.gutenberg.sha' package.json)

          # Write the (untrusted) release notes to a file rather than env.
          jq -r '.body // ""' <<<"$release" > release_notes.md
          {
            printf 'Release: [%s](%s)\n\n' "$TAG" "$RELEASE_URL"
            printf '## Changelog\n\n'
            cat release_notes.md
          } > changelog.md

          {
            echo "NEW_SHA=${NEW_SHA}"
            echo "PR_TITLE=Gutenberg Sync: Update trunk to ${TAG}"
            if [ "${NEW_SHA}" != "${OLD_SHA}" ]; then echo "PROCEED=true"; else echo "PROCEED=false"; fi
          } >> "$GITHUB_ENV"

      - name: Checkout the Gutenberg branch
        if: ${{ inputs.branch != 'trunk' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: WordPress/gutenberg
          ref: wp/${{ env.BASE_BRANCH }}
          path: gutenberg-src
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Resolve wp/X.Y head
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          set -euo pipefail

          NEW_SHA=$(git -C gutenberg-src rev-parse HEAD)
          OLD_SHA=$(jq -r '.gutenberg.sha' package.json)

          if ! git -C gutenberg-src cat-file -e "${OLD_SHA}^{commit}" 2>/dev/null; then
            # shellcheck disable=SC2016  # Backticks are markdown literals, not shell expansions.
            printf -- '_Previous reference `%s` was not found in Gutenberg history; changelog omitted._\n' "${OLD_SHA}" > commit_list.md
          else
            git -C gutenberg-src log --reverse --format="- %s" "${OLD_SHA}...${NEW_SHA}" \
              | sed 's|#\([0-9][0-9]*\)|https://github.com/WordPress/gutenberg/pull/\1|g; /github\.com\/WordPress\/gutenberg\/pull/!d' \
              > commit_list_full.md

            # Cap the changelog so the PR body cannot exceed GitHub's body limit.
            total=$(wc -l < commit_list_full.md)
            if [ "${total}" -gt 300 ]; then
              head -n 300 commit_list_full.md > commit_list.md
              printf -- '- _…and %s more commits; see the compare link above._\n' "$(( total - 300 ))" >> commit_list.md
            else
              cp commit_list_full.md commit_list.md
            fi
          fi

          {
            printf 'Compare: https://github.com/WordPress/gutenberg/compare/%s...%s\n\n' "$OLD_SHA" "$NEW_SHA"
            printf '## Changes\n\n'
            cat commit_list.md
          } > changelog.md

          {
            echo "NEW_SHA=${NEW_SHA}"
            echo "PR_TITLE=Gutenberg Sync: Update ${BASE_BRANCH} to latest wp/${BASE_BRANCH}"
            if [ "${NEW_SHA}" != "${OLD_SHA}" ]; then echo "PROCEED=true"; else echo "PROCEED=false"; fi
          } >> "$GITHUB_ENV"

      - name: Build pull request body
        if: ${{ env.PROCEED == 'true' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # Backticks are markdown literals, not shell expansions.
          {
            printf 'Updates the bundled Gutenberg commit reference for `%s` to `%s`.\n\n' "$BASE_BRANCH" "$NEW_SHA"
            cat changelog.md
          } > pr_body.md

      - name: Push the sync branch to the fork
        if: ${{ env.PROCEED == 'true' }}
        env:
          FORK_REPO: ${{ github.repository }}
          COMMIT_MSG: 'Build/Test Tools: Update the bundled Gutenberg commit reference.'
        run: |
          set -euo pipefail

          # Build the head branch from the upstream target branch plus the bump.
          git checkout -B "${HEAD_BRANCH}"
          jq --tab --arg sha "$NEW_SHA" '.gutenberg.sha = $sha' package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json
          git commit -m "$COMMIT_MSG"

          # Push to the fork this workflow runs in (origin points at upstream).
          git remote add fork "https://github.com/${FORK_REPO}.git"
          git push --force fork "HEAD:${HEAD_BRANCH}"

      - name: Open or update the upstream pull request
        if: ${{ env.PROCEED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GUTENBERG_SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.GUTENBERG_SYNC_TOKEN != '' }}
          FORK_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          compare_url="https://github.com/${UPSTREAM_REPO}/compare/${BASE_BRANCH}...${FORK_OWNER}:${HEAD_BRANCH}?expand=1"

          # Without a PAT, the GITHUB_TOKEN cannot open a PR on upstream. The branch
          # is already pushed, so surface a link to open the PR manually.
          if [ "${HAS_PAT}" != "true" ]; then
            echo "::notice::Branch '${HEAD_BRANCH}' pushed to ${FORK_OWNER}. Set the GUTENBERG_SYNC_TOKEN secret to open PRs automatically, or open it here: ${compare_url}"
            {
              echo "### Gutenberg Sync"
              echo ""
              echo "Pushed \`${HEAD_BRANCH}\` to your fork."
              echo ""
              echo "[Open the pull request](${compare_url})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          prs=$(gh pr list --repo "$UPSTREAM_REPO" --state open --base "$BASE_BRANCH" \
            --label "Gutenberg Sync" --json number,headRefName,headRepositoryOwner)
          ours=$(jq -r --arg o "$FORK_OWNER" --arg h "$HEAD_BRANCH" \
            '[.[] | select(.headRepositoryOwner.login == $o and .headRefName == $h)][0].number // empty' <<<"$prs")
          anyone=$(jq -r '.[0].number // empty' <<<"$prs")

          if [ -n "$ours" ]; then
            # The force-push above already refreshed the branch; update title/body.
            gh pr edit "$ours" --repo "$UPSTREAM_REPO" --title "$PR_TITLE" --body-file pr_body.md
          elif [ -n "$anyone" ]; then
            echo "::notice::An open 'Gutenberg Sync' PR for ${BASE_BRANCH} already exists (#${anyone}); leaving it as-is."
          else
            gh pr create --repo "$UPSTREAM_REPO" --draft \
              --base "$BASE_BRANCH" --head "${FORK_OWNER}:${HEAD_BRANCH}" \
              --title "$PR_TITLE" --body-file pr_body.md --label "Gutenberg Sync"
          fi

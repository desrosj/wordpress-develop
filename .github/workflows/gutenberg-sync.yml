# Opens (or updates) a single draft pull request that updates the bundled
# Gutenberg commit reference (package.json -> gutenberg.sha) for one branch:
#   - "trunk": the commit for Gutenberg's latest public (non-prerelease) release.
#   - an X.Y branch: the head of Gutenberg's matching wp/X.Y branch.
#
# WordPress/wordpress-develop does not accept pushed branches, so this workflow
# runs from a FORK: it checks out the target branch from upstream, pushes a
# gutenberg-sync/<branch> branch to the fork it runs in, and opens a pull
# request from that fork branch back to upstream. Each run targets one branch.
#
# The "Gutenberg Sync" label is applied separately by gutenberg-sync-label.yml
# when a gutenberg-sync/* pull request is opened.
#
# Authentication:
#   - GITHUB_TOKEN (built in) pushes the branch to the fork.
#   - GUTENBERG_SYNC_TOKEN (optional secret) is a personal access token used to
#     open/update the pull request on upstream. Without it, the branch is still
#     pushed and the run prints a link to open the pull request manually.
name: Gutenberg Sync

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update: "trunk" or an X.Y branch name (e.g. "6.8").'
        required: true
        type: string
        default: 'trunk'

# Disable permissions for all available scopes by default.
# Any needed permissions are configured at the job level.
permissions: {}

env:
  # Where pull requests are opened and the target branch is read from.
  UPSTREAM_REPO: WordPress/wordpress-develop
  # The target branch and the bot-managed PR head branch, derived from the input.
  BASE_BRANCH: ${{ inputs.branch }}
  HEAD_BRANCH: gutenberg-sync/${{ inputs.branch }}

# Serialize runs for the same target branch; allow different branches in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  # Creates or updates the draft pull request for the requested branch.
  # Trunk-specific and version-specific work is gated on inputs.branch; every
  # other step is shared.
  sync:
    name: Sync ${{ inputs.branch }}
    runs-on: ubuntu-24.04
    # Runs from a fork; the canonical repository does not accept pushed branches.
    if: ${{ github.repository != 'WordPress/wordpress-develop' }}
    timeout-minutes: 10
    permissions:
      # Push the gutenberg-sync/<branch> branch to the fork this workflow runs in.
      contents: write
    steps:
      - name: Checkout the upstream target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: WordPress/wordpress-develop
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Checkout the pull request body template
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/template-gutenberg-sync-pr-body.md
          sparse-checkout-cone-mode: false
          path: sync-workflow
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ----- Resolve the trunk release (inputs.branch == 'trunk') -----

      - name: Copy the pull request body template
        if: ${{ inputs.branch == 'trunk' }}
        run: |
          cp sync-workflow/.github/template-gutenberg-sync-pr-body.md pr_body.md

      - name: Add the branch name to the body
        if: ${{ inputs.branch == 'trunk' }}
        run: |
          sed -i "s|__BRANCH__|${BASE_BRANCH}|g" pr_body.md

      - name: Retrieve the latest release details
        if: ${{ inputs.branch == 'trunk' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/WordPress/gutenberg/releases/latest)
          TAG=$(jq -r '.tag_name' <<<"$release")
          RELEASE_URL=$(jq -r '.html_url' <<<"$release")
          # The (untrusted) release notes are written to a file for later insertion.
          jq -r '.body // ""' <<<"$release" > changelog_content.md
          {
            echo "TAG=${TAG}"
            echo "RELEASE_URL=${RELEASE_URL}"
            echo "PR_TITLE=Gutenberg Sync: Update trunk to ${TAG}"
          } >> "$GITHUB_ENV"

      - name: Add the release link to the body
        if: ${{ inputs.branch == 'trunk' }}
        run: |
          sed -i "s|__SOURCE_LINE__|Release: [${TAG}](${RELEASE_URL})|g" pr_body.md

      - name: Determine the new commit SHA
        if: ${{ inputs.branch == 'trunk' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/WordPress/gutenberg/git/refs/tags/${TAG}")
          obj_type=$(jq -r '.object.type' <<<"$ref")
          obj_sha=$(jq -r '.object.sha' <<<"$ref")
          if [ "$obj_type" = "tag" ]; then
            NEW_SHA=$(gh api "repos/WordPress/gutenberg/git/tags/${obj_sha}" --jq '.object.sha')
          else
            NEW_SHA="$obj_sha"
          fi
          echo "NEW_SHA=${NEW_SHA}" >> "$GITHUB_ENV"

      - name: Add the new SHA to the body
        if: ${{ inputs.branch == 'trunk' }}
        run: |
          sed -i "s|__NEW_SHA__|${NEW_SHA}|g" pr_body.md

      - name: Add the release notes to the body
        if: ${{ inputs.branch == 'trunk' }}
        run: |
          awk '/__CHANGELOG__/ { while ( ( getline line < "changelog_content.md" ) > 0 ) print line; close( "changelog_content.md" ); next } 1' pr_body.md > pr_body.tmp
          mv pr_body.tmp pr_body.md

      - name: Determine the current SHA
        if: ${{ inputs.branch == 'trunk' }}
        run: |
          set -euo pipefail
          OLD_SHA=$(jq -r '.gutenberg.sha' package.json)
          if [ "${NEW_SHA}" != "${OLD_SHA}" ]; then echo "PROCEED=true"; else echo "PROCEED=false"; fi >> "$GITHUB_ENV"

      # ----- Resolve the wp/X.Y head (inputs.branch != 'trunk') -----

      - name: Checkout the Gutenberg branch
        if: ${{ inputs.branch != 'trunk' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: WordPress/gutenberg
          ref: wp/${{ env.BASE_BRANCH }}
          path: gutenberg-src
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Copy the pull request body template
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          cp sync-workflow/.github/template-gutenberg-sync-pr-body.md pr_body.md

      - name: Add the branch name to the body
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          sed -i "s|__BRANCH__|${BASE_BRANCH}|g" pr_body.md

      - name: Determine the new commit SHA
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          echo "NEW_SHA=$(git -C gutenberg-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Add the new SHA to the body
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          sed -i "s|__NEW_SHA__|${NEW_SHA}|g" pr_body.md

      - name: Determine the current SHA
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          set -euo pipefail
          OLD_SHA=$(jq -r '.gutenberg.sha' package.json)
          {
            echo "OLD_SHA=${OLD_SHA}"
            echo "PR_TITLE=Gutenberg Sync: Update ${BASE_BRANCH} to latest wp/${BASE_BRANCH}"
            if [ "${NEW_SHA}" != "${OLD_SHA}" ]; then echo "PROCEED=true"; else echo "PROCEED=false"; fi
          } >> "$GITHUB_ENV"

      - name: Add the compare link to the body
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          sed -i "s|__SOURCE_LINE__|Compare: https://github.com/WordPress/gutenberg/compare/${OLD_SHA}...${NEW_SHA}|g" pr_body.md

      - name: Build the changelog
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          set -euo pipefail
          if ! git -C gutenberg-src cat-file -e "${OLD_SHA}^{commit}" 2>/dev/null; then
            # shellcheck disable=SC2016  # Backticks are markdown literals, not shell expansions.
            printf -- '_Previous reference `%s` was not found in Gutenberg history; changelog omitted._\n' "${OLD_SHA}" > changelog_content.md
          else
            git -C gutenberg-src log --reverse --format="- %s" "${OLD_SHA}...${NEW_SHA}" \
              | sed 's|#\([0-9][0-9]*\)|https://github.com/WordPress/gutenberg/pull/\1|g; /github\.com\/WordPress\/gutenberg\/pull/!d' \
              > commit_list_full.md

            # Cap the changelog so the PR body cannot exceed GitHub's body limit.
            total=$(wc -l < commit_list_full.md)
            if [ "${total}" -gt 300 ]; then
              head -n 300 commit_list_full.md > changelog_content.md
              printf -- '- _…and %s more commits; see the compare link above._\n' "$(( total - 300 ))" >> changelog_content.md
            else
              cp commit_list_full.md changelog_content.md
            fi
          fi

      - name: Add the changelog to the body
        if: ${{ inputs.branch != 'trunk' }}
        run: |
          awk '/__CHANGELOG__/ { while ( ( getline line < "changelog_content.md" ) > 0 ) print line; close( "changelog_content.md" ); next } 1' pr_body.md > pr_body.tmp
          mv pr_body.tmp pr_body.md

      # ----- Push the sync branch to the fork -----

      - name: Create the sync branch
        if: ${{ env.PROCEED == 'true' }}
        run: |
          git checkout -B "${HEAD_BRANCH}"

      - name: Update the bundled Gutenberg SHA
        if: ${{ env.PROCEED == 'true' }}
        run: |
          set -euo pipefail
          jq --tab --arg sha "$NEW_SHA" '.gutenberg.sha = $sha' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Stage the change
        if: ${{ env.PROCEED == 'true' }}
        run: |
          git add package.json

      - name: Commit the change
        if: ${{ env.PROCEED == 'true' }}
        run: |
          git commit -m "Build/Test Tools: Update the bundled Gutenberg commit reference."

      - name: Add the fork remote
        if: ${{ env.PROCEED == 'true' }}
        env:
          FORK_REPO: ${{ github.repository }}
        run: |
          git remote add fork "https://github.com/${FORK_REPO}.git"

      - name: Push to the fork
        if: ${{ env.PROCEED == 'true' }}
        run: |
          git push --force fork "HEAD:${HEAD_BRANCH}"

      # ----- Open or update the upstream pull request -----

      - name: Look up the existing pull request
        if: ${{ env.PROCEED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GUTENBERG_SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.GUTENBERG_SYNC_TOKEN != '' }}
          FORK_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Without a PAT, the GITHUB_TOKEN cannot open a PR on upstream. The branch
          # is already pushed, so surface a link to open the PR manually.
          if [ "${HAS_PAT}" != "true" ]; then
            compare_url="https://github.com/${UPSTREAM_REPO}/compare/${BASE_BRANCH}...${FORK_OWNER}:${HEAD_BRANCH}?expand=1"
            echo "::notice::Branch '${HEAD_BRANCH}' pushed to ${FORK_OWNER}. Set the GUTENBERG_SYNC_TOKEN secret to open PRs automatically, or open it here: ${compare_url}"
            {
              echo "### Gutenberg Sync"
              echo ""
              echo "Pushed \`${HEAD_BRANCH}\` to your fork."
              echo ""
              echo "[Open the pull request](${compare_url})"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PR_ACTION=manual" >> "$GITHUB_ENV"
            exit 0
          fi

          # Identify an existing open PR for this base by the sync head branch name.
          prs=$(gh pr list --repo "$UPSTREAM_REPO" --state open \
            --base "$BASE_BRANCH" --head "$HEAD_BRANCH" \
            --json number,headRepositoryOwner)
          ours=$(jq -r --arg o "$FORK_OWNER" \
            '[.[] | select(.headRepositoryOwner.login == $o)][0].number // empty' <<<"$prs")
          others=$(jq -r --arg o "$FORK_OWNER" \
            '[.[] | select(.headRepositoryOwner.login != $o)][0].number // empty' <<<"$prs")

          if [ -n "$ours" ]; then
            { echo "PR_NUMBER=${ours}"; echo "PR_ACTION=update"; } >> "$GITHUB_ENV"
          elif [ -n "$others" ]; then
            echo "::notice::An open ${HEAD_BRANCH} PR for ${BASE_BRANCH} already exists (#${others}); leaving it as-is."
            echo "PR_ACTION=skip" >> "$GITHUB_ENV"
          else
            echo "PR_ACTION=create" >> "$GITHUB_ENV"
          fi

      - name: Update the existing pull request
        if: ${{ env.PROCEED == 'true' && env.PR_ACTION == 'update' }}
        env:
          GH_TOKEN: ${{ secrets.GUTENBERG_SYNC_TOKEN || github.token }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$UPSTREAM_REPO" --title "$PR_TITLE" --body-file pr_body.md

      - name: Open a new pull request
        if: ${{ env.PROCEED == 'true' && env.PR_ACTION == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.GUTENBERG_SYNC_TOKEN || github.token }}
          FORK_OWNER: ${{ github.repository_owner }}
        run: |
          gh pr create --repo "$UPSTREAM_REPO" --draft \
            --base "$BASE_BRANCH" --head "${FORK_OWNER}:${HEAD_BRANCH}" \
            --title "$PR_TITLE" --body-file pr_body.md

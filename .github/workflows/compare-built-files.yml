# Compares the results of the build script with the WordPress/WordPress repository.
name: Compare Built Files

on:
  # For pushes, this confirms that the build script produces the same files as the build server.
  push:
    branches:
      - trunk
      - '6.[8-9]'
      - '[7-9].[0-9]'
  # For pull requests, this shows how the files distributed in WordPress/WordPress would change.
  pull_request:
    branches:
      - trunk
      - '6.[8-9]'
      - '[7-9].[0-9]'
    paths:
      - '**'
      # Documentation, repository metadata, and local environment configuration.
      - '!**.md'
      - '!.devcontainer/**'
      - '!.editorconfig'
      - '!.env.example'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!.mailmap'
      - '!docker-compose.yml'
      - '!typings/**'
      - '!wp-cli.yml'
      # Configuration for unrelated checks.
      - '!.eslintrc-jsdoc.js'
      - '!.prettierrc.js'
      - '!.version-support-*.json'
      - '!eslint.config.js'
      - '!jsdoc.conf.json'
      - '!phpcompat.xml.dist'
      - '!phpcs.xml.dist'
      - '!phpstan.neon.dist'
      - '!phpunit.xml.dist'
      - '!tsconfig.json'
      # Tests, unrelated tools, and other workflows do not affect the build.
      - '!tests/**'
      - '!tools/**'
      - '!.github/**'
      # Re-include the tools and workflows used by the build or the comparison.
      - 'tools/gutenberg/**'
      - 'tools/vendors/**'
      - 'tools/webpack/**'
      - '.github/actions/setup-npm/**'
      - '.github/actions/build-server-comparison-report/**'
      - '.github/workflows/compare-built-files.yml'
      - '.github/workflows/reusable-compare-built-files-*.yml'
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the pull request number for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Compares the build directory with the WordPress/WordPress repository.
  compare-built-files:
    name: Compare with WordPress/WordPress
    uses: ./.github/workflows/reusable-compare-built-files-v1.yml
    permissions:
      contents: read
    if: |
      github.repository == 'desrosj/wordpress-develop' ||
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' && (
          ! github.event.repository.private ||
          ! github.event.pull_request.draft ||
          contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
        )
      )

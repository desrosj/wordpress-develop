name: Lint GitHub Actions workflows
on:
  workflow_call:

permissions: {}

jobs:
  # Checks a PR for uncommitted changes to built files.
  #
  # When changes are detected, the patch and PR number are stored as an artifact for the Commit Built File Changes
  # workflow to commit and push the changes back for testing.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up Node.js.
  # - Configures caching for Composer.
  # - Installs Composer dependencies.
  # - Logs general debug information about the runner.
  # - Installs npm dependencies.
  # - Builds CSS file using SASS.
  # - Builds Emoji files.
  # - Builds bundled Root Certificate files.
  # - Builds WordPress.
  # - Checks for changes to versioned files.
  # - Displays the result of git diff for debugging purposes.
  # - Creates a directory for storing PR data.
  # - Saves the patch as a file.
  # - Saves the PR number to a file.
  # - Uploads the PR data as an artifact.
  update-built-files:
    name: Check and update built files
    runs-on: ubuntu-24.04
    # This prevents an unnecessary second run after changes are committed back because Dependabot always rebases
    # updates and force pushes.
    if: ${{ github.actor != 'dependabot[bot]' || github.event.commits < 2 }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # This date is used to ensure that the PHPCS cache is cleared at least once every week.
      # http://man7.org/linux/man-pages/man1/date.1.html
      - name: "Get last Monday's date"
        id: get-date
        run: echo "date=$(/bin/date -u --date='last Mon' "+%F")" >> "$GITHUB_OUTPUT"

      # Since Composer dependencies are installed using `composer update` and no lock file is in version control,
      # passing a custom cache suffix ensures that the cache is flushed at least once per week.
      - name: Install Composer dependencies
        uses: ramsey/composer-install@57532f8be5bda426838819c5ee9afb8af389d51a # v3.0.0
        with:
          custom-cache-suffix: ${{ steps.get-date.outputs.date }}

      - name: Log debug information
        run: |
          npm --version
          node --version
          curl --version
          git --version

      - name: Install npm Dependencies
        run: npm ci

      - name: Run SASS precommit tasks
        run: npm run grunt precommit:css

      - name: Run Emoji precommit task
        run: npm run grunt precommit:emoji
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run certificate tasks
        run: npm run grunt copy:certificates

      - name: Build WordPress
        run: npm run build:dev

      - name: Check for changes to versioned files
        id: built-file-check
        run: |
          if git diff --quiet; then
            echo "uncommitted_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "uncommitted_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Display changes to versioned files
        if: ${{ steps.built-file-check.outputs.uncommitted_changes == 'true' }}
        run: git diff

      - name: Create directory for PR data
        if: ${{ steps.built-file-check.outputs.uncommitted_changes == 'true' }}
        run: mkdir -p ./pr-data

      - name: Save diff to a file
        if: ${{ steps.built-file-check.outputs.uncommitted_changes == 'true' }}
        run: git diff > ./pr-data/changes.diff

      - name: Save PR number
        if: ${{ steps.built-file-check.outputs.uncommitted_changes == 'true' }}
        run: |
          echo "${EVENT_NUMBER}" > ./pr-data/NR
        env:
          EVENT_NUMBER: ${{ github.event.number }}

      # Uploads the PR number and diff as an artifact for the Commit Built File Changes workflow to download and then
      # commit back for testing.
      - name: Upload PR data as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: ${{ steps.built-file-check.outputs.uncommitted_changes == 'true' }}
        with:
          name: pr-data
          path: pr-data/
